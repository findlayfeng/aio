services:
  app:
    image: "${EDGE_EVER_IMAGE:-ghcr.io/tianma-if/edgeever}:${EDGE_EVER_VERSION:-latest}"
    restart: unless-stopped
    init: true
    ports:
      - "${EDGE_EVER_PORT:-8787}:8787"
    environment:
      EDGE_EVER_AUTH_USERNAME: "${EDGE_EVER_AUTH_USERNAME:-admin}"
      EDGE_EVER_AUTH_PASSWORD: "${EDGE_EVER_AUTH_PASSWORD:?Set EDGE_EVER_AUTH_PASSWORD before starting EdgeEver}"
    volumes:
      - data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    labels:
      - traefik.enable=true
      - name=${COMPOSE_PROJECT_NAME}
      - traefik.http.services.app-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8787
    networks:
      - default
      - proxy

volumes:
  data:

networks:
  proxy:
    external: true
