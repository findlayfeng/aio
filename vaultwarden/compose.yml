services:
  vw:
    image: vaultwarden/server:latest
    restart: always
    user: 33:33
    environment:
      - TZ=${TZ:-UTC}
      - DOMAIN=https://vw.${DOMAIN:-localhost}:${TRAEFIK_WEBSECURE_PORT:-8443}
      # https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page#secure-the-admin_token
      - ADMIN_TOKEN=${VM_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
      - SIGNUPS_DOMAINS_WHITELIST=${VW_SIGNUPS_DOMAINS_WHITELIST:-${DOMAIN:-localhost}}
    volumes:
      - data:/data
    labels:
      - traefik.enable=true
    networks:
      - proxy
    post_start:
      - command: chown -R 33:33 /data
        user: root

volumes:
  data:

networks:
  proxy:
    external: true
