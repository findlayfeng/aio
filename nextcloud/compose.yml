x-base: &base
  build:
    context: ./images
    args:
      - NEXTCLOUD_VER=35.0.2
      - RICHDOCUMENTS_VER=12.0.2
      - MEMORIES_VER=11.1.2
      - NOTIFY_PUSH_VER=1.4.2
      - JELLYFIN_FFMPEG_VER=8.1.3-2
  restart: always
  extends:
    file: ../override.yml
    service: x-nextcloud
  tmpfs:
    - /tmp:exec
  volumes:
    - skeleton:/var/www/skeleton
    - html:/var/www/html
    - data:/var/www/data
    - type: volume
      source: caddy_data
      volume:
        subpath: pki/authorities/local/root.crt
      target: /usr/local/share/ca-certificates/caddy_root.crt
      read_only: true
  environment:
    - TZ=${TZ:-UTC}

    - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    - AIO_DOMAIN=${DOMAIN:-localhost}
    - HTTP_INGRES_PORT=${TRAEFIK_WEB_PORT:-8080}
    - HTTPS_INGRES_PORT=${TRAEFIK_WEBSECURE_PORT:-8443}
    - HP_SHARED_KEY=${NEXTCLOUD_HP_SHARED_KEY}

    - TRUSTED_PROXIES=169.254.1.1 169.254.3.128 169.254.3.130
    - REDIS_HOST=redis
    - POSTGRES_HOST=pgsql
    - NEXTCLOUD_DATA_DIR=/var/www/data

    - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
    - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-}
    - NEXTCLOUD_TRUSTED_DOMAINS=${COMPOSE_PROJECT_NAME} ${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}

    - OVERWRITEPROTOCOL=http
    - OVERWRITEHOST=${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}:${TRAEFIK_WEB_PORT:-8080}
    - OVERWRITECLIURL=http://${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}:${TRAEFIK_WEB_PORT:-8080}
    - OVERWRITECONDADDR=${NEXTCLOUD_OVERWRITECONDADDR:-^169\.254\.3\.13[0-2]$}

    - OVERWRITEWEBROOT=${NEXTCLOUD_OVERWRITEWEBROOT:-}

    - PHP_MEMORY_LIMIT=${NEXTCLOUD_PHP_MEMORY_LIMIT:-2G}
    - PHP_FCGI_CHILDREN=${PHP_FCGI_CHILDREN:-5}
    - PHP_UPLOAD_LIMIT=${NEXTCLOUD_PHP_UPLOAD_LIMIT:-2G}

    - POSTGRES_DB=${POSTGRES_DB:-aio}
    - POSTGRES_USER=${POSTGRES_USER:-${POSTGRES_DB:-aio}}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}

services:
  code:
    image: collabora/code:26.04.4.2.1 # https://github.com/CollaboraOnline/online/issues/16401
    restart: always
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
    environment:
      DONT_GEN_SSL_CERT: 1
      server_name: code.${DOMAIN:-localhost}:${TRAEFIK_WEBSECURE_PORT:-8443}
      aliasgroup1: https://${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}:${TRAEFIK_WEBSECURE_PORT:-8443}
      extra_params: |-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:storage.wopi.alias_groups.is_legacy_server=true
        --o:net.post_allow.host[5]=169.254.3.133
        --o:net.post_allow.host[6]=::ffff:169.254.3.133
        --o:net.lok_allow.host[6]=169.254.3.133
        --o:net.lok_allow.host[7]=::ffff:169.254.3.133
        --o:remote_font_config.url=https://${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}:${TRAEFIK_WEBSECURE_PORT:-8443}/apps/richdocuments/settings/fonts.json
    depends_on:
      caddy:
        condition: service_healthy
    volumes:
      - type: volume
        source: certs
        volume:
          subpath: ca-certificates.crt
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
    labels:
      - traefik.enable=true
    networks:
      default:
        ipv4_address: 169.254.3.129
      proxy:

  app:
    <<: *base
    post_start:
      - command: update-ca-certificates
        user: root
      - command:
        - /bin/sh
        - -c
        - |-
          until [ -f /var/www/html/occ ] && flock -n /var/www/html/nextcloud-init-sync.lock true; do
            sleep 2;
          done
      - command: |-
          ./occ notify_push:setup https://${COMPOSE_PROJECT_NAME}.${DOMAIN}:${TRAEFIK_WEBSECURE_PORT:-8443}/push
        user: www-data
    networks:
      default:
        ipv4_address: 169.254.3.133
      internal:
    depends_on:
      caddy:
        restart: true
        condition: service_healthy
      code:
        condition: service_started
      notify_push:
        condition: service_started

  cron:
    <<: *base
    entrypoint: /cron.sh
    post_start:
      - command: update-ca-certificates
        user: root
    depends_on:
      - app
    networks:
      default:
        ipv4_address: 169.254.3.131

  go-vod:
    image: radialapps/go-vod
    restart: always
    init: true
    extends:
      file: ../override.yml
      service: x-go-vod
    depends_on:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:47788/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - NEXTCLOUD_HOST=http://${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}:${TRAEFIK_WEB_PORT:-8080}
      - NEXTCLOUD_ALLOW_INSECURE=1 # (self-signed certs or no HTTPS)
      - NVIDIA_VISIBLE_DEVICES=all
      - CACHE_DIR=/cache
      - GO_VOD_BRIDGE_ENABLED=true # (options: https://memories.gallery/system-config/)
      - GO_VOD_BRIDGE_MAX_WORKERS=4
      - GO_VOD_BRIDGE_MIN_WORKERS=1
      - GO_VOD_BRIDGE_WORKER_TTL=30
      - GO_VOD_BRIDGE_IDLE_TIME=5
    networks:
      default:
    volumes:
      - go-vod-cache:/cache

  appapi-harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:v0.4.8
    restart: always
    environment:
      - TZ=${TZ:-UTC}
      - HP_TRUSTED_PROXY_IPS=169.254.1.1,169.254.3.128
      - HP_SHARED_KEY=${NEXTCLOUD_HP_SHARED_KEY}
      - NC_INSTANCE_URL=http://${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}:${TRAEFIK_WEB_PORT:-8080}
      - HP_FRP_DISABLE_TLS=true
    volumes:
      - type: tmpfs
        target: /tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - type: volume
        source: caddy_data
        volume:
          subpath: pki/authorities/local/root.crt
        target: /usr/local/share/ca-certificates/caddy_root.crt
        read_only: true
    networks:
      app:
      default:
        ipv4_address: 169.254.3.132
      proxy:
    depends_on:
      caddy:
        restart: true
        condition: service_healthy
    post_start:
      - command: update-ca-certificates
        user: root
    labels:
      - traefik.enable=true
      - traefik.http.routers.appapi-harp-${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}`) && PathPrefix(`/exapps/`)
      - traefik.http.services.appapi-harp-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8780

  notify_push:
    image: ghcr.io/nextcloud/notify_push:v1.4.2
    restart: always
    networks:
      default:
        ipv4_address: 169.254.3.130
      internal:
      proxy:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-${POSTGRES_DB:-aio}}:${POSTGRES_PASSWORD:-}@pgsql/${POSTGRES_DB:-aio}
      REDIS_URL: redis://redis
      DATABASE_PREFIX: oc_
      NEXTCLOUD_URL: http://${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}:${TRAEFIK_WEB_PORT:-8080}
    labels:
      - traefik.enable=true
      - traefik.http.routers.notify-push-${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}`) && PathPrefix(`/push/`)

  caddy:
    image: caddy
    restart: always
    volumes:
      - ./caddy:/etc/caddy
      - html:/var/www/html:ro
      - caddy_data:/data/caddy
      - certs:/etc/ssl/certs

    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      - DOMAIN=${DOMAIN:-localhost}
      - HTTP_INGRES_PORT=${TRAEFIK_WEB_PORT:-8080}
      - HTTPS_INGRES_PORT=${TRAEFIK_WEBSECURE_PORT:-8443}

    labels:
      - traefik.enable=true
      - name=${COMPOSE_PROJECT_NAME}
      - traefik.http.services.caddy-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=${TRAEFIK_WEB_PORT:-8080}
      - traefik.http.routers.caddy-${COMPOSE_PROJECT_NAME}.middlewares=caddy-${COMPOSE_PROJECT_NAME}-stsHeaders@docker
      - traefik.http.middlewares.caddy-${COMPOSE_PROJECT_NAME}-stsHeaders.headers.stsSeconds=15552000
      - traefik.http.middlewares.caddy-${COMPOSE_PROJECT_NAME}-stsHeaders.headers.frameDeny=true
      - traefik.http.middlewares.caddy-${COMPOSE_PROJECT_NAME}-stsHeaders.headers.browserXssFilter=true
      - traefik.http.middlewares.caddy-${COMPOSE_PROJECT_NAME}-stsHeaders.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.caddy-${COMPOSE_PROJECT_NAME}-stsHeaders.headers.stsPreload=true
      - traefik.http.middlewares.caddy-${COMPOSE_PROJECT_NAME}-stsHeaders.headers.forceSTSHeader=true

    healthcheck:
      test:
        - CMD-SHELL
        - |
          [ -f /data/caddy/pki/authorities/local/root.crt ] &&
          ( [ "$(stat -c '%a' /data/caddy/pki/authorities/local/root.crt)" = "644" ] || chmod 644 /data/caddy/pki/authorities/local/root.crt ) &&
          awk 'NR==FNR{if($0!~/CERTIFICATE/&&$0!="")t=t$0;next}/BEGIN CERTIFICATE/{c="";f=1;next}/END CERTIFICATE/{f=0;if(c==t){ok=1;exit}}f{c=c$0}END{exit !(ok&&t!="")}' /data/caddy/pki/authorities/local/root.crt /etc/ssl/certs/ca-certificates.crt
      interval: 1s
      timeout: 3s
      retries: 5

    networks:
      default:
        ipv4_address: 169.254.3.128
        aliases:
          - ${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}
          - code.${DOMAIN:-localhost}
      app:
        aliases:
          - ${COMPOSE_PROJECT_NAME}.${DOMAIN:-localhost}
      proxy:

volumes:
  skeleton:
  html:
  data:
  certs:
  caddy_data:
  go-vod-cache:

networks:
  app:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 169.254.2.0/24
          ip_range: 169.254.2.0/25
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 169.254.3.0/24
          ip_range: 169.254.3.0/25
          gateway: 169.254.3.1
  proxy:
    external: true
  internal:
    external: true
