services:
  volume-init:
    image: alpine
    restart: on-failure:3
    command: mkdir -p /opt/scrutiny/influxdb /opt/scrutiny/config
    volumes:
      - scrutiny:/opt/scrutiny

  mariadb:
    image: mariadb:11.8
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: always
    environment:
      - TZ=${TZ:-UTC}
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-}
      - MARIADB_RANDOM_ROOT_PASSWORD=${MARIADB_RANDOM_ROOT_PASSWORD:-}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-aio}
      - MARIADB_USER=${MARIADB_USER:-${MARIADB_DATABASE:-aio}}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-}

    volumes:
      - db:/var/lib/mysql

    networks:
      default:
        ipv4_address: 169.254.4.128
        aliases:
          - db

  pgsql:
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    environment:
      - TZ=${TZ:-UTC}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-aio}
      - POSTGRES_USER=${POSTGRES_USER:-${POSTGRES_DB:-aio}}

    volumes:
      - pgsql_data:/var/lib/postgresql/data

    networks:
      default:
        ipv4_address: 169.254.4.130

  redis:
    image: redis:alpine
    restart: always
    networks:
      default:
        ipv4_address: 169.254.4.129

  scrutiny:
    extends:
      file: ../override.yml
      service: x-scrutiny
    restart: always
    depends_on:
      - volume-init
    image: ghcr.io/analogj/scrutiny:latest
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    labels:
      - traefik.enable=true
      - traefik.http.services.scrutiny.loadbalancer.server.port=8080
    volumes:
      - /run/udev:/run/udev:ro
      - type: volume
        source: scrutiny
        volume:
          subpath: config
        target: /opt/scrutiny/config
      - type: volume
        source: scrutiny
        volume:
          subpath: influxdb
        target: /opt/scrutiny/influxdb
    networks:
      default:
        ipv4_address: 169.254.4.131

volumes:
  pgsql_data:
  db:
  scrutiny:

networks:
  default:
    internal: true
    driver: bridge
    name: internal
    ipam:
      driver: default
      config:
        - subnet: 169.254.4.0/24
          ip_range: 169.254.4.0/25
